name: CI/CD - Test and Deploy to GCP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  DEPLOYMENT_NAME: inventory-app
  IMAGE: inventory-app
  REGISTRY_HOSTNAME: gcr.io

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run backend tests
      run: |
        python manage.py test accounts.tests.test_backend -v 2
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_test
        DEBUG: 'False'

    - name: Run frontend tests
      run: |
        python manage.py test accounts.tests.test_frontend -v 2
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_test
        DEBUG: 'False'

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_CICD_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Configure Docker to use gcloud for authentication
      run: |
        gcloud auth configure-docker ${{ env.REGISTRY_HOSTNAME }}

    - name: Build Docker image
      run: |
        docker build -t "${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.IMAGE }}:${{ github.sha }}" \
          -t "${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.IMAGE }}:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 .

    - name: Push Docker image to Container Registry
      run: |
        docker push "${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.IMAGE }}:${{ github.sha }}"
        docker push "${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.IMAGE }}:latest"

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_CICD_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.DEPLOYMENT_NAME }} \
          --image ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.IMAGE }}:${{ github.sha }} \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --set-env-vars "DEBUG=False,ALLOWED_HOSTS=*,CLOUD_RUN_URL=inventory-app-${{ env.PROJECT_ID }}.${{ env.GCP_REGION }}.run.app" \
          --memory 512Mi \
          --cpu 1 \
          --timeout 3600s \
          --max-instances 100

    - name: Output Cloud Run URL
      run: |
        gcloud run services describe ${{ env.DEPLOYMENT_NAME }} \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --format='value(status.url)'

    - name: Health Check - Verify Deployment
      run: |
        # Get the Cloud Run service URL
        SERVICE_URL=$(gcloud run services describe ${{ env.DEPLOYMENT_NAME }} \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --format='value(status.url)')
        
        echo "Testing service at: $SERVICE_URL"
        
        # Wait for service to be ready
        sleep 5
        
        # Check if the service responds
        for i in {1..10}; do
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL)
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "302" ]; then
            echo "✓ Service is healthy (HTTP $RESPONSE)"
            break
          else
            echo "Attempt $i: HTTP $RESPONSE - retrying..."
            sleep 3
          fi
        done
